<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاصناف</title>
    
    <!-- Style sheets -->
    <link rel="stylesheet" href="/css/master.css">
    <link rel="stylesheet" href="../css/components/sidebar.css">
    <link rel="stylesheet" href="../css/components/input.css">
    <link rel="stylesheet" href="../css/components/select.css">
    <link rel="stylesheet" href="../css/components/table.css">
    <link rel="stylesheet" href="../css/components/button.css">
    <link rel="stylesheet" href="../css/items-page.css">

</head>
<body>
    
    <div id="sidebar">
        <a href="../index.html">
        <div id="sidebar-title">
            <img src="../assets/icons-svg/boxes.svg" alt="boxes-icon">
            <h2>المخزن</h2>
        </div>
        </a>
        <div id="navbar">
            <ul id="navbar-list">
                <a href="items-page.html">
                <li  id="items-page-nav" class="active">
                    <img src="../assets/icons-svg/box.svg" alt="box-icon">
                    <p>الاصناف</p>
                </li>
                </a>
                <a href="withdraw-page.html">
                <li id="withdraw-page-nav">
                    <img src="../assets/icons-svg/transaction.svg" alt="transaction-icon">
                    <p>الاصناف المسحوبة</p>
                </li>
                </a>

                <a href="add-items-stock-page.html">
                <li id="add-items-sotck-nav">
                    <img src="../assets/icons-svg/add-icon.svg" alt="add-icon">
                    <p>اضافة الي المخزن</p>
                </li>
                </a>
                
                <a href="add-item-page.html">
                <li id="add-items-page-nav">
                    <img src="/assets/icons-svg/tag-icon.svg" alt="tag-icon">
                    <p>اضافة كارت صنف</p>
                </li>
                </a>
            </ul>
        </div>
    </div>



    <div id="items-page-wrapper">

        <div id="search-filter-wrapper">
            <img src="../assets/icons-svg/search.svg" alt="search-icon">
            
            <input type="text" id="text-search-field" placeholder="ابحث بإسم الصنف">

            <select id="category-search-field">
                <option value="ALL">كل الانواع</option>
                <option value="GENERAL">عام</option>
                <option value="TAB">اقراص</option>
                <option value="SYRUP">شراب</option>
                <option value="DROP">نقط</option>
                <option value="SACHET">اكياس</option>
                <option value="CREAM">كريم</option>
                <option value="SUPP">لبوس</option>
            </select>

            <select id="filter-state-field">
                <option value="all">الكل</option>
                <option value="av">متوفر</option>
                <option value="not-av">خلصان</option>
            </select>

        </div>


        <div id="table-wrapper">
            <table id="items-table">
                    <thead>
                        <tr>
                            <th>الكود</th>
                            <th>اسم الصنف</th>
                            <th id="req">الكمية المطلوبة</th>
                            <th>الكميةالمتاحة</th>
                            <th>النوع</th>
                        </tr>
                    </thead>
                    <tbody id="items-table-body">
                    </tbody>
                </table>
        </div>

        <div id="withdrawButtonWrapper">
            <button id="withdrawButton"> سحب الكل </button>
        </div>

    </div>

    

    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/items-page.js"></script>
    <script type="module" src="../js/withdraw-functions.js"></script>

</body>
</html>
